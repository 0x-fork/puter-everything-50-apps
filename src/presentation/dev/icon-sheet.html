<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Command icons</title>
    <style>
      body {
        font: 11px system-ui;
        margin: 12px;
        background: #fff;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, 118px);
        gap: 6px;
      }
      figure {
        margin: 0;
        display: grid;
        justify-items: center;
        gap: 3px;
        padding: 4px;
        border: 1px solid #eee;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      body.dark {
        background: #1f1f1f;
        color: #ddd;
      }
    </style>
  </head>
  <body>
    <!-- Glass fills for the command icons (src/chrome/icons.css): top-lit
         gradients whose stops are the --ico-* tokens, so every theme retints
         them. Not display:none, which would disable the gradients. -->
    <svg
      class="ico-defs"
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
      style="position: absolute; width: 0; height: 0; overflow: hidden"
    >
      <defs>
        <linearGradient id="ico-g-paper" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0.25" style="stop-color: var(--ico-paper-top)" />
          <stop offset="1" style="stop-color: var(--ico-paper)" />
        </linearGradient>
        <linearGradient id="ico-g-blue-soft" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-glass-rim)" />
          <stop offset="0.3" style="stop-color: var(--ico-blue-soft-top)" />
          <stop offset="1" style="stop-color: var(--ico-blue-soft)" />
        </linearGradient>
        <linearGradient id="ico-g-blue-solid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-blue-top)" />
          <stop offset="1" style="stop-color: var(--ico-blue-deep)" />
        </linearGradient>
        <linearGradient id="ico-g-green-soft" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-glass-rim)" />
          <stop offset="0.3" style="stop-color: var(--ico-green-soft-top)" />
          <stop offset="1" style="stop-color: var(--ico-green-soft)" />
        </linearGradient>
        <linearGradient id="ico-g-green-solid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-green-top)" />
          <stop offset="1" style="stop-color: var(--ico-green-deep)" />
        </linearGradient>
        <linearGradient id="ico-g-red-soft" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-glass-rim)" />
          <stop offset="0.3" style="stop-color: var(--ico-red-soft-top)" />
          <stop offset="1" style="stop-color: var(--ico-red-soft)" />
        </linearGradient>
        <linearGradient id="ico-g-red-solid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-red-top)" />
          <stop offset="1" style="stop-color: var(--ico-red-deep)" />
        </linearGradient>
        <linearGradient id="ico-g-yellow-soft" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-glass-rim)" />
          <stop offset="0.3" style="stop-color: var(--ico-yellow-soft-top)" />
          <stop offset="1" style="stop-color: var(--ico-yellow-soft)" />
        </linearGradient>
        <linearGradient id="ico-g-yellow-solid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-yellow-top)" />
          <stop offset="1" style="stop-color: var(--ico-yellow-deep)" />
        </linearGradient>
        <linearGradient id="ico-g-amber-soft" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-glass-rim)" />
          <stop offset="0.3" style="stop-color: var(--ico-amber-soft-top)" />
          <stop offset="1" style="stop-color: var(--ico-amber-soft)" />
        </linearGradient>
        <linearGradient id="ico-g-amber-solid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-amber-top)" />
          <stop offset="1" style="stop-color: var(--ico-amber-deep)" />
        </linearGradient>
        <linearGradient id="ico-g-purple-soft" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-glass-rim)" />
          <stop offset="0.3" style="stop-color: var(--ico-purple-soft-top)" />
          <stop offset="1" style="stop-color: var(--ico-purple-soft)" />
        </linearGradient>
        <linearGradient id="ico-g-purple-solid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-purple-top)" />
          <stop offset="1" style="stop-color: var(--ico-purple-deep)" />
        </linearGradient>
        <linearGradient id="ico-g-slide-soft" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-glass-rim)" />
          <stop offset="0.3" style="stop-color: var(--ico-slide-soft-top)" />
          <stop offset="1" style="stop-color: var(--ico-slide-soft)" />
        </linearGradient>
        <linearGradient id="ico-g-slide-solid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--ico-slide-top)" />
          <stop offset="1" style="stop-color: var(--ico-slide-deep)" />
        </linearGradient>
      </defs>
    </svg>
    <main></main>
    <script type="module">
      import { COMMAND_ICONS, commandIcon } from "../src/chrome/icons.js";
      if (location.hash === "#dark") {
        document.body.classList.add("dark");
        document.documentElement.dataset.theme = "dark";
      }
      const main = document.querySelector("main");
      for (const name of Object.keys(COMMAND_ICONS)) {
        const fig = document.createElement("figure");
        const row = document.createElement("div");
        row.className = "row";
        row.append(commandIcon(name, 32), commandIcon(name, 16));
        const label = document.createElement("figcaption");
        label.textContent = name;
        fig.append(row, label);
        main.append(fig);
      }
    </script>
  </body>
</html>
