<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Parametric</title>
    <meta name="description" content="Parametric is an open-source 3D CAD app for feature-based part modeling in your browser: constrained sketches, extrudes, revolves, fillets, shells, holes and patterns on a real B-rep kernel, with STEP and STL export." />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2226" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="Parametric" />
    <meta property="og:description" content="Open-source parametric 3D CAD in your browser." />
    <meta property="og:image" content="./icon-512.png" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.json" />
    <script>
      // Resolve the theme before first paint to avoid a flash.
      (function () {
        var root = document.documentElement, t = 'system';
        try { t = localStorage.getItem('parametric:theme') || 'system'; } catch (e) {}
        var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = t;
        root.dataset.themeResolved = dark ? 'dark' : 'light';
      })();
    </script>
    <script src="https://js.puter.com/v2/" defer></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the graphics area</a>
    <div id="app" aria-busy="true"></div>
    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <noscript>Parametric needs JavaScript to run.</noscript>
  </body>
</html>
