# For monorepo deployments, keep these headers in sync with this app's entry
# in ../../customHttp.yml, which Amplify reads from the repository root.
customHeaders:
  # Revalidate the app entry point, including visits without index.html.
  - pattern: '/'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'
  - pattern: '**/*.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'

  # Vite includes content hashes in generated asset filenames.
  # Keep unversioned public files outside this directory.
  - pattern: '/assets/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
