<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spreadsheet: phone and tablet preview</title>
  <style>
    body { margin: 0; padding: 24px; background: #2a2a2a; font: 13px system-ui, sans-serif; color: #ddd; display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { margin-bottom: 8px; opacity: 0.7; }
    iframe { border: 0; border-radius: 28px; background: #fff; display: block; }
  </style>
</head>
<body>
  <figure>
    <figcaption>Phone, 390 x 780</figcaption>
    <iframe src="/mock.html" width="390" height="780" title="Phone preview"></iframe>
  </figure>
  <figure>
    <figcaption>Tablet, 820 x 1000</figcaption>
    <iframe src="/mock.html" width="820" height="1000" title="Tablet preview"></iframe>
  </figure>
</body>
</html>
