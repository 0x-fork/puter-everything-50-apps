  <script>
function report(){
 const preview=document.getElementById("tasks-title-preview");
 const focused=document.activeElement;
 const r=preview?.getBoundingClientRect();
 const details={viewport:[innerWidth,innerHeight],focus:focused?.id||focused?.className||focused?.tagName,preview:preview&&!preview.hidden?[Math.round(preview.scrollTop),preview.scrollHeight-preview.clientHeight]:null,box:preview&&!preview.hidden?[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)]:null};
 parent.postMessage({audit:"actual-task-resize",description:JSON.stringify(details)},"http://127.0.0.1:5181");
}
addEventListener("focusin",()=>requestAnimationFrame(report));
addEventListener("resize",()=>requestAnimationFrame(report));
addEventListener("scroll",()=>requestAnimationFrame(report),true);
new MutationObserver(()=>requestAnimationFrame(report)).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["hidden"]});
