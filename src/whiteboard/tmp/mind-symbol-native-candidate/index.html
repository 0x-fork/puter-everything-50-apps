<script>
for(const type of ['pointerdown','pointerup','click','lostpointercapture'])document.addEventListener(type,e=>{
 const button=e.target.closest?.('[data-mind-direction],[data-mind-collapse]');
 if(button)parent.postMessage({event:type,pointerId:e.pointerId,detail:e.detail,direction:button.dataset.mindDirection,quick:button.dataset.quickDirection,collapse:button.dataset.mindCollapse},'*');
},{capture:true,passive:true});
</script>
<script>
let visibilityLast='';
new MutationObserver(()=>{
 const controls=[...document.querySelectorAll('#mind-ports button:not([hidden]),#mind-collapse-ports button,#quick-ports button')].map(button=>({direction:button.dataset.mindDirection,quick:button.dataset.quickDirection,collapse:button.dataset.mindCollapse,text:button.firstChild.textContent,visibility:getComputedStyle(button.firstChild).visibility,hover:button.matches(':hover'),focus:button.matches(':focus-visible')}));
 const next=JSON.stringify(controls);if(controls.length&&next!==visibilityLast){visibilityLast=next;parent.postMessage({controls},'*');}
}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','style','aria-expanded']});
</script>
