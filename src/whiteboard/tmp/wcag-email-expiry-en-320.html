<!doctype html><html lang="en"><meta charset="utf-8"><title>Local email expiry recovery en</title><iframe title="Actual organization verification component" style="width:320px;height:400px;border:0" src="wcag-email-native-normal.html?lang=en&scenario=expiry"></iframe><p><button id="advance">Advance local worker clock by 16 minutes</button></p><p id="clock"></p><p id="metrics"></p><script>document.getElementById("advance").onmousedown=e=>e.preventDefault();document.getElementById("advance").onclick=async()=>{const r=await fetch("http://127.0.0.1:5183/advance?lang=en&scenario=expiry");document.getElementById("clock").textContent=JSON.stringify(await r.json());};addEventListener("message",e=>{if(e.origin===location.origin&&e.data?.audit==="email-assistance")document.getElementById("metrics").textContent=e.data.description;});</script></html>
