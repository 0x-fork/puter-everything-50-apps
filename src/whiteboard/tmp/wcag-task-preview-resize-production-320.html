<!doctype html><html lang="en"><meta charset="utf-8"><title>Actual production Timeline resize</title><iframe id="subject" title="Actual Tasks component" style="width:320px;height:400px;border:0" src="http://127.0.0.1:5182/task-preview-resize-final.html#local=a87ed6fc-39fd-4f5b-9006-93cdcc1be63f"></iframe><p><button id="grow" type="button">Resize viewport taller</button><button id="restore" type="button">Restore viewport</button><button id="wide" type="button">Resize viewport wider</button></p><p id="metrics"></p><script>for(const [id,height] of [["grow","500px"],["restore","400px"]]){const button=document.getElementById(id);button.addEventListener("mousedown",e=>e.preventDefault());button.onclick=()=>{document.getElementById("subject").style.height=height;if(id==="restore")document.getElementById("subject").style.width="320px";};}const wide=document.getElementById("wide");wide.addEventListener("mousedown",e=>e.preventDefault());wide.onclick=()=>{const frame=document.getElementById("subject");frame.style.width="420px";frame.style.height="300px";};addEventListener("message",e=>{if(e.origin==="http://127.0.0.1:5182"&&e.data?.audit==="actual-task-resize")document.getElementById("metrics").textContent=e.data.description;});</script></html>
