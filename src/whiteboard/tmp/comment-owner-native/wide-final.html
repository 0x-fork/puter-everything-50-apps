<!doctype html><title>Comment pointer verification</title><style>body{margin:0}iframe{width:1200px;height:800px;border:0}pre{white-space:pre-wrap;font-size:14px}</style><iframe src="index-final.html#local=627ce816-9152-4672-81c7-47c44c30b77a"></iframe><pre id="entry"></pre><pre id="events"></pre><pre id="model"></pre><script>const events=[];addEventListener('message',e=>{if(e.source!==document.querySelector('iframe').contentWindow)return;if(e.data.productionEntry){document.querySelector('#entry').textContent=e.data.productionEntry;}else if(e.data.event){events.push(e.data);document.querySelector('#events').textContent=JSON.stringify(events.slice(-5));}else if(e.data.model)document.querySelector('#model').textContent=JSON.stringify(e.data.model);})</script>
