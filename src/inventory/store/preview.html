<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory | Store asset review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eee6;color:#241302;font:16px/1.5 system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:2;background:#fffaf2ed;backdrop-filter:blur(16px);padding:20px 32px;display:flex;align-items:center;gap:24px;border-bottom:1px solid #dccfbd}h1{font-size:22px;line-height:1.2;margin:0}header p{margin:3px 0 0;color:#6a5540;font-size:14px}button{padding:9px 14px;border:1px solid #c8ad8e;background:#fff6e9;border-radius:8px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#ff8f15;border-color:#c5700e}nav{display:flex;gap:8px;margin-left:auto}main{padding:28px 32px}section{margin-bottom:44px}h2{font-size:20px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;align-items:start}figure{margin:0}figure a{display:block}figure img{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 10px 25px #301e0c1b}figcaption{margin-top:10px;font-weight:600;font-size:14px}body[data-scale] .grid{display:flex;flex-wrap:wrap;gap:28px}body[data-scale] figure{flex:none}body[data-scale] figure img{width:var(--preview-width)}@media(max-width:1000px){header{align-items:flex-start;flex-wrap:wrap}nav{margin-left:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div><h1>Inventory store assets</h1><p>15 final PNGs. Five feature slides in each size.</p></div><nav aria-label="Preview scale"><button data-value="fit" aria-pressed="true">Fit all</button><button data-value="0.35" aria-pressed="false">35%</button><button data-value="0.6" aria-pressed="false">60%</button><button data-value="1" aria-pressed="false">100%</button></nav></header>
<main id="gallery"></main><script>
const slides=[['app-overview','App overview'],['stock-by-location','Stock by location'],['smart-reordering','Smart reordering'],['scan-and-take-out','Scan and take out'],['sales-and-profit','Sales and profit']];
const gallery=document.querySelector('#gallery');
for(const [w,h] of [[1920,1080],[1024,768],[1080,2280]]){const section=document.createElement('section');section.innerHTML=`<h2>${w} × ${h}</h2><div class="grid">${slides.map(([slug,title],i)=>`<figure data-width="${w}"><a href="screenshots/${w}x${h}/0${i+1}-${slug}.png"><img src="screenshots/${w}x${h}/0${i+1}-${slug}.png" width="${w}" height="${h}" alt="${title}, ${w} by ${h}"></a><figcaption>0${i+1} · ${title}</figcaption></figure>`).join('')}</div>`;gallery.append(section)}
document.querySelectorAll('button').forEach(button=>button.onclick=()=>{document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));if(button.dataset.value==='fit')delete document.body.dataset.scale;else{document.body.dataset.scale=button.dataset.value;document.querySelectorAll('figure').forEach(f=>f.style.setProperty('--preview-width',`${Number(f.dataset.width)*Number(button.dataset.value)}px`))}});
</script></body></html>
