<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Play Backgammon Online — free in your browser</title>
  <!--
    The social preview card, rendered to public/og-image.png by
    tools/render-images.mjs. Everything is drawn here rather than screenshotted
    so the picture keeps working when the app's layout changes; the palette is
    the one in src/style.css, so it still looks like the same product.
  -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f2f7f4" />
      <stop offset="1" stop-color="#e0ebe5" />
    </linearGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2a5b44" />
      <stop offset="1" stop-color="#193a2b" />
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f2e5d2" />
      <stop offset="1" stop-color="#dbcbb0" />
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9b3e2f" />
      <stop offset="1" stop-color="#7d3126" />
    </linearGradient>
    <radialGradient id="wc" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ded2bc" />
    </radialGradient>
    <radialGradient id="bc" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#4a5442" />
      <stop offset="1" stop-color="#21291c" />
    </radialGradient>
    <g id="checker-w"><circle r="19" fill="url(#wc)" stroke="#c4b99f" stroke-width="2.5" /></g>
    <g id="checker-b"><circle r="19" fill="url(#bc)" stroke="#584e45" stroke-width="2.5" /></g>
  </defs>

  <rect width="1200" height="630" fill="url(#page)" />

  <!-- The mark is composited in here from src/icon.png by
       tools/render-images.mjs: 96x96 at (72, 74). -->

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#172620">
    <text x="184" y="145" font-size="52" font-weight="700" letter-spacing="-1">Backgammon</text>
    <text x="72" y="272" font-size="58" font-weight="700" letter-spacing="-1.5">Play free in your</text>
    <text x="72" y="336" font-size="58" font-weight="700" letter-spacing="-1.5">browser.</text>
    <text x="72" y="404" font-size="26" font-weight="500" fill="#5a6f65">Against the computer, a friend</text>
    <text x="72" y="440" font-size="26" font-weight="500" fill="#5a6f65">beside you, or a friend anywhere.</text>
    <text x="72" y="524" font-size="23" font-weight="700" fill="#96590d">backgammon.puter.com</text>
  </g>

  <!-- A board, drawn to the app's own proportions. -->
  <g>
    <rect x="546" y="86" width="608" height="458" rx="20" fill="#463323" />
    <rect x="560" y="100" width="580" height="430" rx="8" fill="url(#felt)" />

    <!-- Twelve points, alternating, six a side of the bar. -->
    <g>
      <path d="M560 100 H605.5 L582.75 270 Z" fill="url(#ivory)" />
      <path d="M605.5 100 H651 L628.25 270 Z" fill="url(#clay)" />
      <path d="M651 100 H696.5 L673.75 270 Z" fill="url(#ivory)" />
      <path d="M696.5 100 H742 L719.25 270 Z" fill="url(#clay)" />
      <path d="M742 100 H787.5 L764.75 270 Z" fill="url(#ivory)" />
      <path d="M787.5 100 H833 L810.25 270 Z" fill="url(#clay)" />
      <path d="M867 100 H912.5 L889.75 270 Z" fill="url(#ivory)" />
      <path d="M912.5 100 H958 L935.25 270 Z" fill="url(#clay)" />
      <path d="M958 100 H1003.5 L980.75 270 Z" fill="url(#ivory)" />
      <path d="M1003.5 100 H1049 L1026.25 270 Z" fill="url(#clay)" />
      <path d="M1049 100 H1094.5 L1071.75 270 Z" fill="url(#ivory)" />
      <path d="M1094.5 100 H1140 L1117.25 270 Z" fill="url(#clay)" />

      <path d="M560 530 H605.5 L582.75 360 Z" fill="url(#clay)" />
      <path d="M605.5 530 H651 L628.25 360 Z" fill="url(#ivory)" />
      <path d="M651 530 H696.5 L673.75 360 Z" fill="url(#clay)" />
      <path d="M696.5 530 H742 L719.25 360 Z" fill="url(#ivory)" />
      <path d="M742 530 H787.5 L764.75 360 Z" fill="url(#clay)" />
      <path d="M787.5 530 H833 L810.25 360 Z" fill="url(#ivory)" />
      <path d="M867 530 H912.5 L889.75 360 Z" fill="url(#clay)" />
      <path d="M912.5 530 H958 L935.25 360 Z" fill="url(#ivory)" />
      <path d="M958 530 H1003.5 L980.75 360 Z" fill="url(#clay)" />
      <path d="M1003.5 530 H1049 L1026.25 360 Z" fill="url(#ivory)" />
      <path d="M1049 530 H1094.5 L1071.75 360 Z" fill="url(#clay)" />
      <path d="M1094.5 530 H1140 L1117.25 360 Z" fill="url(#ivory)" />
    </g>

    <rect x="833" y="100" width="34" height="430" fill="#463323" />

    <!-- Checkers, in an arrangement a real game could have reached. -->
    <use href="#checker-b" x="582.75" y="122" />
    <use href="#checker-b" x="582.75" y="160" />
    <use href="#checker-b" x="582.75" y="198" />
    <use href="#checker-w" x="810.25" y="122" />
    <use href="#checker-w" x="810.25" y="160" />
    <use href="#checker-w" x="935.25" y="122" />
    <use href="#checker-w" x="935.25" y="160" />
    <use href="#checker-w" x="935.25" y="198" />
    <use href="#checker-w" x="935.25" y="236" />
    <use href="#checker-b" x="1117.25" y="122" />

    <use href="#checker-w" x="628.25" y="508" />
    <use href="#checker-w" x="628.25" y="470" />
    <use href="#checker-b" x="764.75" y="508" />
    <use href="#checker-b" x="764.75" y="470" />
    <use href="#checker-b" x="764.75" y="432" />
    <use href="#checker-b" x="1026.25" y="508" />
    <use href="#checker-b" x="1026.25" y="470" />
    <use href="#checker-w" x="1117.25" y="508" />
    <use href="#checker-w" x="1117.25" y="470" />
    <use href="#checker-w" x="1117.25" y="432" />

    <!-- The dice, thrown into the right half. -->
    <g transform="translate(936,290)">
      <rect width="50" height="50" rx="11" fill="#f7f4ec" stroke="#00000022" />
      <circle cx="14" cy="14" r="4.6" fill="#21291c" />
      <circle cx="36" cy="14" r="4.6" fill="#21291c" />
      <circle cx="25" cy="25" r="4.6" fill="#21291c" />
      <circle cx="14" cy="36" r="4.6" fill="#21291c" />
      <circle cx="36" cy="36" r="4.6" fill="#21291c" />
    </g>
    <g transform="translate(1004,290)">
      <rect width="50" height="50" rx="11" fill="#f7f4ec" stroke="#00000022" />
      <circle cx="14" cy="14" r="4.6" fill="#21291c" />
      <circle cx="25" cy="25" r="4.6" fill="#21291c" />
      <circle cx="36" cy="36" r="4.6" fill="#21291c" />
    </g>

    <!-- The doubling cube, on the bar. -->
    <g transform="translate(826,290)">
      <rect width="48" height="48" rx="9" fill="#fdfaf1" stroke="#00000022" />
      <text x="24" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#2b2521" text-anchor="middle">2</text>
    </g>
  </g>
</svg>
