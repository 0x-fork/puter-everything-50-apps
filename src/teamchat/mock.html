<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Teamchat (mock dev)</title>
  <script>
    (() => {
      try {
        const t = localStorage.getItem('teamchat:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    })();
  </script>
  <script type="module" src="/dev/mock-boot.js"></script>
</head>
<body>
  <div id="app" class="app"></div>
</body>
</html>
