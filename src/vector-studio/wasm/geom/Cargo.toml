[package]
name = "geom"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
i_overlay = { version = "=9.0.1", default-features = false }
kurbo = { version = "=0.13.1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
